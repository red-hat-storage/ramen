---
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 2
    # These Kubernetes/operator libraries are upgraded deliberately and in
    # lockstep; leave them out of automated Dependabot bumps.
    ignore:
      - dependency-name: "k8s.io/api"
      - dependency-name: "k8s.io/apimachinery"
      - dependency-name: "k8s.io/component-base"
      - dependency-name: "sigs.k8s.io/controller-runtime"
      - dependency-name: "github.com/operator-framework/api"

  - package-ecosystem: "gomod"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "k8s.io/api"
      - dependency-name: "k8s.io/apimachinery"
      - dependency-name: "k8s.io/component-base"
      - dependency-name: "sigs.k8s.io/controller-runtime"
      - dependency-name: "github.com/operator-framework/api"

  - package-ecosystem: "gomod"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "k8s.io/api"
      - dependency-name: "k8s.io/apimachinery"
      - dependency-name: "k8s.io/component-base"
      - dependency-name: "sigs.k8s.io/controller-runtime"
      - dependency-name: "github.com/operator-framework/api"

  - package-ecosystem: "gomod"
    directory: "/test/timestamp"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 2

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 2

  - package-ecosystem: "pip"
    directory: "/test"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 2

  - package-ecosystem: "pip"
    directory: "/ramendev"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 2

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 2







  # Downstream only code
  # Everything below is required in the downstream fork but not in the upstream
  # The whitespace above is to help with the automatic backports

  # --- release-5.0 ---

  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "release-5.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      go-root:
        patterns:
          - "*"
    ignore:
      - dependency-name: "k8s.io/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "sigs.k8s.io/controller-runtime"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "gomod"
    directory: "/api"
    target-branch: "release-5.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      go-api:
        patterns:
          - "*"
    ignore:
      - dependency-name: "k8s.io/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "sigs.k8s.io/controller-runtime"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "gomod"
    directory: "/e2e"
    target-branch: "release-5.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      go-e2e:
        patterns:
          - "*"
    ignore:
      - dependency-name: "k8s.io/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "sigs.k8s.io/controller-runtime"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "gomod"
    directory: "/test/timestamp"
    target-branch: "release-5.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      go-timestamp:
        patterns:
          - "*"
    ignore:
      - dependency-name: "k8s.io/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "sigs.k8s.io/controller-runtime"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "release-5.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "release-5.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

